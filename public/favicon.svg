      <rect x="12" y="15" width="6.5" height="4.5" rx="1.5" />
      <rect x="12" y="21.5" width="6.5" height="4.5" rx="1.5" />
    </g>
    <g opacity="0.8">
      <rect x="20.75" y="15" width="6.5" height="4.5" rx="1.5" />
      <rect x="20.75" y="21.5" width="6.5" height="4.5" rx="1.5" />
      <rect x="20.75" y="28" width="6.5" height="4.5" rx="1.5" />
    </g>
    <g>
      <rect x="29.5" y="15" width="6.5" height="4.5" rx="1.5" />
      <rect x="29.5" y="21.5" width="6.5" height="4.5" rx="1.5" />
    </g>
  </g>
</svg>
