<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  fill="none"
  role="img"
  aria-label="ProjeTeus"
>
  <!-- Favicon: mesma marca sobre fundo primary -->
  <rect width="48" height="48" rx="12" fill="#F97316" />

  <!-- moldura do board (branca) -->
